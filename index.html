<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENDIGOFLIX</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">MENDIGOFLIX</div>
        <nav class="nav-links">
            <a href="#" class="active">Início</a>
            <a href="#">Séries</a>
            <a href="#">Filmes</a>
        </nav>
    </header>

    <main class="banner">
        <div class="banner-content">
            <h1 class="banner-title">Barbie Vida de Sereia</h1>
            <p class="banner-description">
                Nesta nova aventura, Barbie é Merliah, uma campeã de surf de Malibu. Em um momento ela é uma adolescente e no outro aprende um chocante segredo de família: ela é uma sereia!
            </p>
            <div class="banner-buttons">
                <button class="btn btn-play">► Assistir</button>
                <button class="btn btn-info">Mais informações</button>
            </div>
        </div>
    </main>

    <section class="movies-container">
        <h2 class="row-title">Filmes</h2>
        <div class="movies-row">
            <div class="movie-card"><img src="https://seuentretenimento.com/wp-content/uploads/2025/11/madagascar-filme-1-1024x576.webp" alt="Madagascar"></div>
            <div class="movie-card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs_SyQsZXNSb5I7JGxAUcKOPqDWAWVkQU3hLI905busiDMh6KUFVWP3nsy&s=10" alt="VIVA: A vida é uma festa"></div>
            <div class="movie-card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9HqZT5mjiss--aYXOLONSf1cPs5LpdgyYBOVmHoiwYaQ16uQ1nK8Qmqs&s=10" alt="Tá chovendo hamburguer 2"></div>
            <div class="movie-card"><img src="https://i.redd.it/tnlu1ase71i91.jpg" alt="My Little Pony: Friendship is magic "></div>
            <div class="movie-card"><img src="https://i.ytimg.com/vi/O_EaVQJ8fRY/sddefault.jpg" alt="Carros 3"></div>
            <div class="movie-card"><img src="https://www.animationmagazine.net/wordpress/wp-content/uploads/WinXftr.jpg" alt="Winx"></div>
        </div>
    </section>

</body>
</html>
